name: release

on:
  push:
    tags:
      - v*

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.8"
      - uses: actions/setup-node@v7.0.0
      - run: scripts/version
      - run: sudo apt update && sudo apt install gcc-mingw-w64-x86-64 gcc-aarch64-linux-gnu -y
      - run: scripts/build
      - run: docker build --build-arg VERSION=$VERSION -t $IMAGE_NAME:$VERSION .
      - run: docker push $IMAGE_NAME:$VERSION
      - run: curl -s -u ${{ secrets.CHARTS_CREDENTIALS }} --data-binary @dist/speakerbob-$CHART_VERSION.tar.gz https://charts.jacobapayne.com/api/charts
      - uses: softprops/action-gh-release@v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/*
          prerelease: ${{ env.IS_PRERELEASE }}
